<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Strix Owl v2 — "lean": cinched by a belt, wide-shock eyes, little legs.
       Same family as v1 (geometric amber owl); the orbital halo is gone,
       replaced by a waist belt with buckle. The belly bulges below the belt. -->
  <defs>
    <linearGradient id="owl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b544"/>
      <stop offset="1" stop-color="#d97a1f"/>
    </linearGradient>
  </defs>
  <!-- legs: orange stubs + three-toed fans (double stroke = outline) -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#3d2b12" stroke-width="8">
      <path d="M105 204 L 105 213"/><path d="M135 204 L 135 213"/>
      <path d="M105 213 L 97 223"/><path d="M105 213 L 105 224"/><path d="M105 213 L 113 223"/>
      <path d="M135 213 L 127 223"/><path d="M135 213 L 135 224"/><path d="M135 213 L 143 223"/>
    </g>
    <g stroke="#e8632c" stroke-width="4.5">
      <path d="M105 204 L 105 213"/><path d="M135 204 L 135 213"/>
      <path d="M105 213 L 97 223"/><path d="M105 213 L 105 224"/><path d="M105 213 L 113 223"/>
      <path d="M135 213 L 127 223"/><path d="M135 213 L 135 224"/><path d="M135 213 L 143 223"/>
    </g>
  </g>
  <!-- body: narrow waist, belly bulging BELOW the belt -->
  <path d="M120 48
           C 86 48 64 70 64 102
           L 64 126
           C 64 137 71 143 79 146
           C 86 149 90 152 90 158
           C 90 166 85 171 82 178
           C 79 187 82 197 90 203
           C 98 208 109 210 120 210
           C 131 210 142 208 150 203
           C 158 197 161 187 158 178
           C 155 171 150 166 150 158
           C 150 152 154 149 161 146
           C 169 143 176 137 176 126
           L 176 102
           C 176 70 154 48 120 48 Z"
        fill="url(#owl)" stroke="#3d2b12" stroke-width="5" stroke-linejoin="round"/>
  <!-- ear tufts -->
  <path d="M78 62 L 70 36 L 96 50 Z" fill="url(#owl)" stroke="#3d2b12" stroke-width="5" stroke-linejoin="round"/>
  <path d="M162 62 L 170 36 L 144 50 Z" fill="url(#owl)" stroke="#3d2b12" stroke-width="5" stroke-linejoin="round"/>
  <!-- eyes: wide shock, tiny pupils, raised brows -->
  <g stroke="#3d2b12" stroke-width="5">
    <circle cx="97" cy="98" r="27" fill="#fdf6e3"/>
    <circle cx="143" cy="98" r="27" fill="#fdf6e3"/>
    <circle cx="99" cy="102" r="6" fill="#3d2b12" stroke="none"/>
    <circle cx="141" cy="102" r="6" fill="#3d2b12" stroke="none"/>
    <circle cx="101.5" cy="99.5" r="2.2" fill="#fdf6e3" stroke="none"/>
    <circle cx="143.5" cy="99.5" r="2.2" fill="#fdf6e3" stroke="none"/>
  </g>
  <g fill="none" stroke="#3d2b12" stroke-width="5" stroke-linecap="round">
    <path d="M72 62 q 16 -12 34 -6"/>
    <path d="M168 62 q -16 -12 -34 -6"/>
  </g>
  <!-- beak: closed diamond, v1-style -->
  <path d="M120 122 L 110 138 L 120 156 L 130 138 Z" fill="#e8632c" stroke="#3d2b12" stroke-width="4" stroke-linejoin="round"/>
  <!-- belt + buckle + holes -->
  <g stroke="#241708" stroke-width="4" stroke-linejoin="round">
    <rect x="66" y="148" width="108" height="20" rx="9" fill="#4a3421"/>
    <rect x="104" y="143" width="32" height="30" rx="6" fill="#e8b13c"/>
    <rect x="113" y="152" width="14" height="12" rx="2" fill="#4a3421" stroke-width="3"/>
    <circle cx="88" cy="158" r="2.6" fill="#e8b13c" stroke="none"/>
    <circle cx="97" cy="158" r="2.6" fill="#e8b13c" stroke="none"/>
    <circle cx="145" cy="158" r="2.6" fill="#e8b13c" stroke="none"/>
    <circle cx="154" cy="158" r="2.6" fill="#e8b13c" stroke="none"/>
  </g>
  <!-- tension creases: three per side, vivid orange, radiating from the belt -->
  <g stroke="#e8632c" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M63 144 l -11 -7"/>
    <path d="M60 154 l -13 0"/>
    <path d="M63 164 l -11 7"/>
    <path d="M177 144 l 11 -7"/>
    <path d="M180 154 l 13 0"/>
    <path d="M177 164 l 11 7"/>
  </g>
</svg>
